[project]
name = "akshare_multi_factor_demo"

[universe]
# 000300 = 沪深300, 000905 = 中证500
index_symbols = ["000300", "000905"]
# 可额外追加手工股票池；留空表示只使用指数成分股。
symbols = []
# index: 直接使用指数成分股；active_boards: 从指数成分股中筛选活跃/资金流板块内股票。
mode = "active_boards"
# 资金流/热度靠前的行业和概念板块数量。
board_top_n = 10
# 当前默认从沪深300 + 中证500中筛选活跃板块内前100只。
max_symbols = 100

[data]
start_date = "20220101"
end_date = ""
adjust = "qfq"
cache_dir = "data/raw"
workers = 8
# auto: AkShare 东方财富失败后自动尝试腾讯接口
# eastmoney: 只用 AkShare stock_zh_a_hist
# tencent: 只用 AkShare stock_zh_a_hist_tx
provider = "auto"

[strategy]
rebalance = "W-FRI"
top_n = 10
min_history_days = 80

[factors]
momentum_20 = 1.0
momentum_60 = 1.0
ma_gap_20 = 0.8
volatility_20 = -0.8
drawdown_60 = 0.7
volume_ratio_20 = 0.3

[output]
report_dir = "reports"
